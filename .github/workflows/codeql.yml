name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    # Code scanning is free on public repositories but requires GitHub Advanced Security on
    # private ones, so this job is skipped rather than failed when GHAS is unavailable.
    #   ENABLE_CODEQL = true   always run (private repositories that do have GHAS)
    #   ENABLE_CODEQL = false  never run
    #   unset                  run only on public repositories, and only for push and
    #                          pull_request, because the schedule event carries no
    #                          repository payload to test visibility against
    if: >-
      vars.ENABLE_CODEQL == 'true' ||
      (vars.ENABLE_CODEQL != 'false' && github.event.repository.private == false)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: csharp,javascript-typescript
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet build GitHubCopilotBudgetManager.slnx --configuration Release
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2